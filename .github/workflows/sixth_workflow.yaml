name: Sixth Workflow

on:
    push:
        branches:
            - main
            - "page/*" # page/about page/blog
            - "page/**" # page/category/lifestyle
        tags:
            - v1.*
            - "!1.2.1" # skip this tag
        paths:
            - "**.html"
            - "docs/**"
            - "!docs/README.md" # skip this file

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Event Vars
              run: |
                  echo "Commit SHA: ${{ github.sha }}"
                  echo "Branch: ${{ github.ref }}"
                  echo "Event Name: ${{ github.event_name }}"
